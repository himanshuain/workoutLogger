name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - run: npx playwright install chromium --with-deps

      - name: E2E tests (unauthenticated)
        run: npm run test:e2e -- --grep-invert @auth

      - name: E2E tests (authenticated)
        run: |
          if [ -z "$E2E_TEST_EMAIL" ] || [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "Skipping authenticated E2E — E2E_TEST_EMAIL / E2E_TEST_PASSWORD not configured"
            exit 0
          fi
          npm run test:e2e -- --grep @auth
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
